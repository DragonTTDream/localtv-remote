name: Build Windows installer (personal fork)

# 个人自用魔改版：在 GitHub 的 Windows runner 上打包安装包并挂到 Release。
# 本机是 Linux，无法产出 Windows 安装包（build-sea 用 rcedit 改 PE，build-installer 用 Inno Setup ISCC）。
#
# 手动触发：Actions → Build Windows installer → Run workflow → 填 tag。
# 例：gh workflow run build-installer.yml -f tag=v0.1.1-desktop.2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并挂产物的 tag/ref（如 v0.1.1-desktop.2）'
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build dist (typecheck + bundle + SEA exe + payload)
        run: npm run dist

      - name: Compile installer
        run: npm run installer

      - name: List release artifacts
        run: dir release
        shell: cmd

      # 让产物自证身份：版本号相同的两个包无法区分，所以把源码指纹写进资产。
      - name: Write BUILD-INFO (proves which source went in)
        shell: bash
        run: |
          {
            echo "tag=${{ github.event.inputs.tag }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "[sha256]"
            sha256sum public/control/controller.js
            sha256sum public/control/index.html
            sha256sum public/control/controller.css
            echo
            echo "[left-click fix marker: pointerLockElement !== trackpad]"
            grep -c 'pointerLockElement !== trackpad' public/control/controller.js
            echo "[volume slider marker: volume-track]"
            grep -c 'volume-track' public/control/controller.js
            grep -c 'volume-track' public/control/index.html
          } > release/BUILD-INFO.txt
          cat release/BUILD-INFO.txt

      - name: Attach installer to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }} — personal fork build
          prerelease: true
          body: |
            **Personal, unofficial fork build / 个人自用魔改版**

            Desktop-browser improvements over upstream: pointer capture (Pointer Lock),
            right-click (button 2) and middle-click (button 1), plus fallback buttons —
            and since v0.1.1-desktop.3 a fix for left-click being dead while pointer-locked,
            plus a draggable volume slider.

            `BUILD-INFO.txt` lists the source commit and the sha256 of the packaged UI files,
            so you can tell two builds apart.

            Not affiliated with, endorsed by, or merged into upstream; no support provided.
            Windows 10/11 · unsigned (SmartScreen "unknown publisher" 提示属正常，点 More info → Run anyway)。
          files: |
            release/*.exe
            release/BUILD-INFO.txt
          fail_on_unmatched_files: true
